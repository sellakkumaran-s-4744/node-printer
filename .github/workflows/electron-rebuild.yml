name: Electron Rebuild

on:
  workflow_dispatch:
  push:
    branches: [node-24-support]
  pull_request:
    branches: [node-24-support]

env:
  ELECTRON_VERSION: 35.2.1
  ELECTRON_DIST_URL: https://electronjs.org/headers

jobs:
  rebuild:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x64

    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Install CUPS dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build for Electron ${{ env.ELECTRON_VERSION }}
        run: >-
          npx node-pre-gyp rebuild package
          --runtime=electron
          --target=${{ env.ELECTRON_VERSION }}
          --dist-url=${{ env.ELECTRON_DIST_URL }}
          --arch=${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ env.ELECTRON_VERSION }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/stage/**
